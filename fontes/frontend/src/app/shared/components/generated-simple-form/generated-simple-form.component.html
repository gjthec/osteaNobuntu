<form [formGroup]="resourceForm" class="generated-form" *ngIf="dataToCreatePage.attributes.length == 1; else noAttributes">
    <ng-container class="form-render-area" #placeToRender></ng-container>
</form>

<ng-template #noAttributes>
    <form id="formBase" class="generated-form" [formGroup]="resourceForm">
        <ng-container class="form-render-area" #placeToRender></ng-container>
    </form>
</ng-template>
