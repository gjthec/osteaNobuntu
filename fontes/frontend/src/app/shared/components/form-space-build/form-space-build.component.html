<div *ngIf="formStepperStructure.length > 0" class="form-space content">
	<mat-horizontal-stepper class="form-stepper" #stepper [linear]="isLinear">
		<form id="formBase" class="form-grid" [formGroup]="resourceForm">
			<mat-step *ngFor="let pagina of formStepperStructure; let i = index" [label]="pagina.name">
				<form id="formBase" class="lateral-margin form-grid" [formGroup]="resourceForm">
					<ng-container class="form-render-area" #placeToRender></ng-container>
				</form>
				<ng-content></ng-content>
			</mat-step>
		</form>
	</mat-horizontal-stepper>


	<div id="fixedButtons" class="fixed-actions flex justify-end items-center px-6 py-4 space-x-2">
		<button mat-fab class="px-6 ml-3" (click)="return()" *ngIf="isFirstStep(stepper)" color="warn">
			<mat-icon>arrow_back</mat-icon>
		</button>
		<button (click)="stepper.previous()" mat-fab class="px-6 ml-3" *ngIf="!isFirstStep(stepper)">
			<mat-icon svgIcon="mat_solid:arrow_back"></mat-icon>
		</button>
		<button (click)="stepper.next()" mat-fab class="px-6 ml-3" *ngIf="!isLastStep(stepper)">
			<mat-icon svgIcon="mat_solid:arrow_forward"></mat-icon>
		</button>
		<button (click)="submitFormFunction()" [disabled]="submitFormLoadingEnabled" mat-fab class="px-6 ml-3"
			*ngIf="isLastStep(stepper)">
			<mat-icon *ngIf="submitFormLoadingEnabled == false" svgIcon="mat_solid:save"></mat-icon>
			<mat-spinner [diameter]="30" [strokeWidth]="10" *ngIf="submitFormLoadingEnabled == true"></mat-spinner>
		</button>
	</div>
</div>

<div class="form-space form-card mb-4 p-2 rounded-2xl shadow w-full inline-block"
	*ngIf="formStepperStructure.length == 0">
	<form id="formBase" class="form-grid" [formGroup]="resourceForm">
		<ng-container class="form-render-area" #placeToRender></ng-container>
	</form>

	<div id="fixedButtons" class="fixed-actions flex justify-end items-center px-6 py-4 space-x-2">
		<button mat-fab class="px-6 ml-3" (click)="return()" color="warn">
			<mat-icon>arrow_back</mat-icon>
		</button>
		<button (click)="submitFormFunction()" [disabled]="submitFormLoadingEnabled" mat-fab class="px-6 ml-3">
			<mat-icon *ngIf="submitFormLoadingEnabled == false" svgIcon="mat_solid:save"></mat-icon>
			<mat-spinner [diameter]="30" [strokeWidth]="10" *ngIf="submitFormLoadingEnabled == true"></mat-spinner>
		</button>
	</div>
</div>
