<div class="default-card">
    <div class="default-card__content" *ngIf="isSelectable == true">
        <div id="cardBase" class="default-card__grid" [ngStyle]="customStyle">
            <ng-container #placeToRender></ng-container>
        </div>
        <button mat-icon-button matSuffix (click)="onClickToEdit()" class="default-card__action" *ngIf="isEditable == true">
            <mat-icon svgIcon="create"></mat-icon>
        </button>
    </div>
</div>
